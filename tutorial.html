<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocNest</title>
  <meta name="description" content="DocNest — a lightweight study place for AI enthusiasts. Read docs, guides, and tutorials on anything AI." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/markdown.css" />
  <link rel="stylesheet" href="css/portal.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css" />
  <script src="js/theme.js"></script>
</head>
<body>
  <a class="visually-hidden" href="#main-content">Skip to content</a>

  <div class="reading-progress" id="reading-progress" aria-hidden="true"></div>

  <header class="navbar">
    <div class="navbar-inner">
      <div class="navbar-brand-group">
        <button type="button" class="sidebar-toggle" aria-label="Toggle tutorial navigation" aria-expanded="false" aria-controls="sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
            <path d="M4 7h16M4 12h16M4 17h10" />
          </svg>
        </button>
        <a href="index.html" class="brand">
          <span class="brand-mark" aria-hidden="true">D</span>
          DocNest
        </a>
      </div>
      <nav class="nav-actions" aria-label="Primary">
        <a class="nav-link" href="index.html#learning-paths">Learning Paths</a>
        <a class="nav-link" href="papers.html">Papers</a>
        <div class="search-wrap" id="search-wrap">
          <div class="search-input-group">
            <svg class="search-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
              <circle cx="7" cy="7" r="5" />
              <path d="M11 11L14.5 14.5" stroke-linecap="round" />
            </svg>
            <input
              type="search"
              id="search-input"
              placeholder="Search a topic…"
              aria-label="Search tutorials"
              autocomplete="off"
            />
            <span class="kbd-hint" aria-hidden="true">/</span>
          </div>
          <div class="search-dropdown" id="search-dropdown" role="listbox" aria-label="Search results"></div>
        </div>
        <button
          type="button"
          class="theme-toggle"
          data-theme-toggle
          aria-label="Switch theme"
          aria-pressed="false"
        >
          <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle class="sun-path" cx="12" cy="12" r="4" />
            <path class="sun-path" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
          <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="moon-path" d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="page-shell">
      <aside class="sidebar" id="sidebar"></aside>

      <div class="content-column">
        <div class="tutorial-header">
          <div class="tutorial-header-inner">
            <p class="tutorial-breadcrumb" id="tutorial-breadcrumb">Docs</p>
            <h1 class="tutorial-title" id="tutorial-title">Loading…</h1>
            <div class="tutorial-meta-row" id="tutorial-meta-row"></div>
          </div>
        </div>

        <div class="tutorial-body">
          <article class="markdown-content" id="markdown-content"></article>

          <aside class="toc" id="toc" aria-label="Table of contents"></aside>
        </div>

        <section class="related-section" id="related-section" aria-label="Related tutorials"></section>

        <div class="feedback-widget" id="feedback-widget" hidden>
          <p class="feedback-question">Was this tutorial helpful?</p>
          <div class="feedback-actions">
            <button type="button" class="feedback-btn" data-vote="yes">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.3a2 2 0 0 0 2-1.7l1.4-9a2 2 0 0 0-2-2.3H14z"/><path d="M7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
              Yes
            </button>
            <button type="button" class="feedback-btn" data-vote="no">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10 15v4a3 3 0 0 0 3 3l4-9V2H5.7a2 2 0 0 0-2 1.7l-1.4 9a2 2 0 0 0 2 2.3H10z"/><path d="M17 2h3a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-3"/></svg>
              No
            </button>
          </div>
          <p class="feedback-thanks">Thanks for the feedback!</p>
        </div>

        <nav class="tutorial-pagination" id="tutorial-pagination" aria-label="Tutorial navigation"></nav>
      </div>
    </div>
  </main>

  <div class="sidebar-backdrop" aria-hidden="true"></div>

  <div class="chat-widget" id="chat-widget">
    <button
      type="button"
      class="chat-launcher attention"
      id="chat-launcher"
      aria-label="Ask the AI teacher"
      aria-expanded="false"
      aria-controls="chat-panel"
    >
      <span class="chat-badge" id="chat-badge">1</span>
      <svg class="chat-launcher-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.3c-1.2 0-2.3-.2-3.4-.6L4 21l1.2-3.6A8.38 8.38 0 1 1 21 11.5z"/>
      </svg>
      <svg class="chat-launcher-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>

    <div class="chat-panel" id="chat-panel" role="dialog" aria-hidden="true" aria-label="Ask the AI teacher">
      <header class="chat-panel-header">
        <div class="chat-panel-heading">
          <span class="chat-avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 9L12 4 2 9l10 5 10-5z"/>
              <path d="M6 11.5V16c0 1.5 2.7 3 6 3s6-1.5 6-3v-4.5"/>
              <path d="M22 9v5"/>
            </svg>
          </span>
          <div class="chat-panel-heading-text">
            <span class="chat-title">k-mentor</span>
            <span class="chat-subtitle">Your AI teacher · online</span>
          </div>
        </div>
        <div class="chat-header-actions">
          <button type="button" class="chat-clear" id="chat-clear" aria-label="Clear conversation" title="Clear conversation">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/>
            </svg>
          </button>
          <button type="button" class="chat-close" id="chat-close" aria-label="Close chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18"/>
            </svg>
          </button>
        </div>
      </header>

      <div class="chat-body" id="chat-body" aria-live="polite"></div>

      <div class="chat-input-row">
        <input
          type="text"
          id="chat-input"
          placeholder="Ask anything about AI…"
          autocomplete="off"
          aria-label="Message the AI teacher"
        />
        <button type="button" class="chat-send" id="chat-send" aria-label="Send message">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <p>DocNest — a nest for your AI curiosity.</p>
    <p class="footer-links">
      Built by
      <a href="https://kaushixlabs.eskaykaushik14.workers.dev/" target="_blank" rel="noopener">Kaushix Labs</a>
      ·
      <a href="https://eskaykaushik.github.io/myProfile/" target="_blank" rel="noopener">Shubham Kaushik</a>
    </p>
  </footer>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase.js"></script>
  <script type="module" src="js/tutorial.js"></script>
  <script type="module" src="js/chat.js"></script>
</body>
</html>
